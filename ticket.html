<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Signaler un incident</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/chartes.css" rel="stylesheet"> 
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark"> 
            <div class="container"> 
            <a class="navbar-brand" href="index.html">Val-Sorin</a> 
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"> 
                <span class="navbar-toggler-icon"></span> 
            </button> 
                <div class="collapse navbar-collapse" id="menu"> 
                    <ul class="navbar-nav"> 
                        <li class="nav-item"><a class="nav-link active" href="index.html">Accueil</a></li>
                        <li class="nav-item"><a class="nav-link" href="secteurs.html">Secteurs</a></li> 
                        <li class="nav-item"><a class="nav-link" href="ticket.html">Signaler un incident</a></li> 
                    </ul> 
                </div> 
            </div> 
        </nav>
    </header>
    <main>
        <form action="traiter_signalement.php" method="post">
            <fieldset>
                <legend>Déclaration d'incident</legend>

                <label for="secteur">Secteur concerné</label>

                <select id="secteur" name="secteur" required>
                    <option value="S1">Savane</option>
                    <option value="S2">Forêt tropicale</option>
                    <option value="S3">Banquise</option>
                    <option value="S4">Ferme pédagogique</option>
                    <option value="S5">Grande volière</option>
                    <option value="S6">Aquarium</option>
                </select>
                <br>
                <label for="sujet">Sujet</label>
                <input id="sujet" name="sujet" type="text" maxlength="120" required>
                <br>
                <label for="description">Description</label>
                <textarea id="description" name="description" required></textarea>
                <br>
                <fieldset>
                    <legend>Priorité</legend>
                    <input
                        type="radio"
                        id="basse"
                        name="priorite"
                        value="basse"
                        checked
                    >
                    <label for="basse">Basse</label>
                    <br>
                    <input type="radio" id="moyenne" name="priorite" value="moyenne">
                    <label for="moyenne">Moyenne</label>
                    <br>
                    <input type="radio" id="haute" name="priorite" value="haute">
                    <label for="haute">Haute</label>
                </fieldset>
                <label for="email">Votre adresse électronique</label>
                <input id="email" name="email" type="email" required>
                <br>
                <button type="submit">Envoyer la déclaration</button>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>Parc animalier de Val-Sorin — route des Étangs, Val-Sorin</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
